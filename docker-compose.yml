services:
  db:
    image: postgres:16-alpine
    container_name: ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    # 5433 on the host so this never collides with a locally installed Postgres,
    # and so the test suite can reach it without going through the api container.
    ports:
      - '5433:5432'
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: ledger-api
    # Waits for Postgres to pass its healthcheck, so startup migrations cannot race it.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      PORT: '3000'
      # Google sign-in. Unset is a supported state: the UI says so on its sign-in screen
      # instead of failing, so the stack still comes up for someone without a client id.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Signs the session cookie. Unset means a random one per boot, so sessions end with
      # the container -- fine for a demo, set it for anything longer lived.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Simulated funds a new account opens with, so a fresh sign-in has something to withdraw.
      SIGNUP_BALANCE: ${SIGNUP_BALANCE:-1000}
    ports:
      - '3000:3000'

volumes:
  ledger-pgdata:
